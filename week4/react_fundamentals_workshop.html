<!doctype html>
<html lang="en">

<head>

  <style>
    :root {
      --bg: #0b0d12;
      --panel: #171b25;
      --panel2: #202635;
      --text: #f5f6fa;
      --muted: #b0b8c9;
      --accent: #1689d5;
      --line: #353b49;
      --green: #71d7ad

    body.light {
      --bg: #f6f7fb;
      --panel: #fff;
      --panel2: #edf0f6;
      --text: #1a2030;
      --muted: #526073;
      --line: #d6dce6;
      --green: #187653

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.55 system-ui, -apple-system, Segoe UI, sans-serif
    }

    header {
      height: 64px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4vw;
      gap: 14px
    }

    header strong {
      font-size: 14px;
      letter-spacing: .13em
    }

    header small {
      color: var(--muted)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px
    }

    .brandmark {
      background: var(--accent);
      color: white;
      font-weight: 900;
      padding: 6px 9px;
      border-radius: 5px
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .iconbtn,
    .nav button,
    .reveal {
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 15px;
      border-radius: 9px
    }

    .nav button:disabled {
      opacity: .3;
      cursor: not-allowed
    }

    .reveal {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 700
    }

    .slide {
      max-width: 1220px;
      margin: auto;
      padding: 5vh 5vw 110px;
      min-height: calc(100vh - 130px)
    }

    .eyebrow {
      color: #64b8f3;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase

      line-height: 1.12;
      margin: 16px 0 24px;
      letter-spacing: -.035em
    }

    h2 {
      font-size: clamp(26px, 3.4vw, 43px);
      line-height: 1.2;
      margin: 12px 0 20px
    }

    h3 {
      margin: 0 0 9px;
      font-size: 19px
    }

    p {
      color: var(--muted);
      max-width: 850px
    }

    li {
      margin: 8px 0
    }

    .lead {
      font-size: 22px;
      max-width: 900px
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 24px 0
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 23px;
      min-width: 0
    }

    .panel p {
      margin: 7px 0
    }

    .panel ul {
      padding-left: 23px
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .13em;
      color: #64b8f3;
      font-weight: 800;
      margin-bottom: 12px
    }

    .solution {
      display: none;
      margin-top: 20px
    }

    .solution.visible {
      display: block
    }

    .solution .panel {
      border-color: #1689d5
    }

    .code {
      white-space: pre;
      overflow: auto;
      background: #0b101a;
      color: #e7edf7;
      border: 1px solid #303a4b;
      border-radius: 10px;
      padding: 19px;
      font: 14px/1.58 ui-monospace, SFMono-Regular, Consolas, monospace;
      tab-size: 2;
      max-height: 47vh
    }

    .tip {
      border-left: 4px solid var(--green);
      padding: 12px 18px;
      background: var(--panel);
      margin: 18px 0
    }

    .tip strong {
      color: var(--green)
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding: 12px 4vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .counter {
      color: var(--muted);
      font-size: 13px
    }

    .progress {
      height: 3px;
      background: var(--panel2);
      position: fixed;
      bottom: 68px;
      left: 0;
      right: 0
    }

    .bar {
      height: 100%;
      background: var(--accent);
      transition: width .2s
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      background: var(--panel2);
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
      margin: 4px
    }

    .miniapp {
      background: #f7f8fc;
      color: #242b39;
      border-radius: 12px;
      padding: 24px;
      max-width: 560px
    }

    .miniapp .task {
      background: white;
      border: 1px solid #d9dfea;
      border-radius: 7px;
      padding: 10px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between
    }

    .miniapp button {
      background: #1689d5;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 7px 11px
    }

    .miniapp input {
      padding: 9px;
      border: 1px solid #bbc3d2;
      border-radius: 6px;
      max-width: 65%
    }

    kbd {
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 4px
    }

    body.light .code {
      color: #e7edf7
    }

    @media(max-width:750px) {
      .columns {
        grid-template-columns: 1fr
      }

      .slide {
        padding: 28px 20px 115px
      }

      header {
        padding: 0 15px
      }

      .code {
        font-size: 12px
      }

      header small {
        display: none
      }

      .footer {
        padding: 10px 15px
      }

      .nav button {
        padding: 8px 10px
      }
    }
  </style>
</head>

        tag: 'Final · Complete reference', title: 'Full working App.jsx — Part 1', challenge: 'Use this reference only after finishing the challenges. Compare your state and event handlers.', code: `import { useEffect, useState } from 'react';
import TaskItem from './components/TaskItem';

export default function App() {
  const [tasks, setTasks] = useState(() => {
    try {
      const saved = localStorage.getItem('study-tasks');
      return saved ? JSON.parse(saved) : [
        { id: 'sample-1', title: 'Review JSX', completed: false },
        { id: 'sample-2', title: 'Practice props', completed: true }
      ];
    } catch { return []; }
  });
  const [newTitle, setNewTitle] = useState('');
  const [filter, setFilter] = useState('all');

  useEffect(() => {
    localStorage.setItem('study-tasks', JSON.stringify(tasks));
  }, [tasks]);

  function handleAddTask(event) {
    event.preventDefault();
    const title = newTitle.trim();
    if (!title) return;
    setTasks(previous => [...previous, {
      id: crypto.randomUUID(), title, completed: false
    }]);
    setNewTitle('');
  }

  function toggleTask(id) {
    setTasks(previous => previous.map(task =>
      task.id === id ? { ...task, completed: !task.completed } : task
    ));
  }
  function deleteTask(id) {
    setTasks(previous => previous.filter(task => task.id !== id));
  }`, explain: ['This is the final version of the state and event logic.', 'The next slide contains the remaining JSX.'], takeaway: 'Each feature adds one small piece to a consistent state model.'
